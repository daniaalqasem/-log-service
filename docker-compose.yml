services:
  db:
    image: postgres:16
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_wal_size=2GB
      -c wal_buffers=16MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/logs
      RETENTION_DAYS: 30
    ports:
      - "8080:8080"
    command: sh -c "rm -f /tmp/log-service-ready; node dist/scripts/migrate.js & exec node dist/index.js"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
