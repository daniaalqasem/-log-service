name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check / build
        run: npm run build

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service..."
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker compose logs
          exit 1

      - name: Smoke test - POST /logs
        run: |
          curl -sf -X POST http://localhost:8080/logs \
            -H "Content-Type: application/json" \
            -d '{"logs":[{"timestamp":"2026-01-01T00:00:00Z","level":"info","service":"ci","message":"smoke test"}]}' \
            | grep '"accepted":1'

      - name: Smoke test - GET /logs
        run: |
          curl -sf "http://localhost:8080/logs?service=ci" | grep '"service":"ci"'

      - name: Smoke test - GET /logs/aggregate
        run: |
          curl -sf "http://localhost:8080/logs/aggregate?since=2026-01-01T00:00:00Z&until=2026-01-02T00:00:00Z&bucket=1h" \
            | grep 'buckets'

      - name: Tear down
        if: always()
        run: docker compose down -v
